<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- scss link -->
    <link rel="stylesheet" href="css/style.css" />

    <script src="js/script.js" defer></script>
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <main>
      <!-- <h1 class="header">SPLI<br />TTER</h1> -->
      <img class="logo_splitter" src="./images/logo.svg" alt="splitter logo">
      <div class="tip-container">
        <section class="tip-function-container">
         <div class="input-container">
              <h3 class="header">Bill</h3>
              <input type="text" id="bill" placeholder="0" />
              <img src="./images/icon-dollar.svg" class="input-icon" alt="Dollar Icon">
          </div>

          <div class="tip-percentage">
            <h3 class="header">Select Tip %</h3>
            <div class="tip-percentage-function">
              <button class="tip-percentage-input input-percent" value="5">5%</button>
              <button class="tip-percentage-input input-percent" value="10">10%</button>
              <button class="tip-percentage-input input-percent" value="15">15%</button>
              <button class="tip-percentage-input input-percent" value="25">25%</button>
              <button class="tip-percentage-input input-percent" value="50">50%</button>
              <input class="tip-percentage-input" type="text" id="customPercent" placeholder="Custom" />
            </div>
          </div>

          <div class="input-container">
            <div class="number-of-people">
              <h3 class="header">Number of People</h3>
              <span class="error-msg">Can't be zero</span>
            </div>
            <input type="text" id="numberOfPeople" placeholder="0" />
            <img src="./images/icon-dollar.svg" class="input-icon" alt="Dollar Icon">
          </div>
        </section>

        <section class="tip-computation-container">

          <div>
            <div class="tip-amount">
              <p class="tip-amount_label">Tip Amount <br><span class="tip-amount_label-span">/ person</span></p>
              <p class="tip-amount_value" id="tipAmount">$0.00</p>
            </div>
            
            <div class="tip-amount">
              <p class="tip-amount_label">Total <br><span class="tip-amount_label-span">/ person</span></p>
              <p class="tip-amount_value" id="tipTotal">$0.00</p>
            </div>
          </div>

          <button class="tip-reset" id="reset">Reset</button>
        </section>
      </div>
      <br />
    </main>

    <!-- <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.frontendmentor.io/profile/alberthruado"
        >Alberth Ruado</a
      >.
    </div> -->
  </body>
</html>
