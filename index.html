<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <!-- scss link -->
    <link rel="stylesheet" href="css/style.css" />

    <script src="js/script.js" defer></script>
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <main>
      <h1 class="header">SPLI<br />TTER</h1>
      <div class="tip-container">
        <section class="tip-function-container">
          <div>
            <h3 class="header">Bill</h3>
            <input type="text" id="bill" placeholder="0" />
          </div>

          <div class="tip-percentage">
            <h3 class="header">Select Tip %</h3>
            <div class="tip-percentage-function">
              <button class="tip-percentage-input" id="fivePercent">5%</button>
              <button class="tip-percentage-input" id="tenPercent">10%</button>
              <button class="tip-percentage-input" id="fifteenPercent">15%</button>
              <button class="tip-percentage-input" id="Percent">25%</button>
              <button class="tip-percentage-input" id="Percent">50%</button>
              <input class="tip-percentage-input" type="text" id="customPercent" placeholder="Custom" />
            </div>
          </div>

          <div>
            <h3 class="header">Number of People</h3>
            <input type="text" id="numberOfPeople" placeholder="0" />
          </div>
        </section>

        <section class="tip-computation-container">

          <div>
            <div class="tip-amount">
              <p>Tip Amount <br>/ person</p>
              <p>$0.00</p>
            </div>
            
            <div class="tip-amount">
              <p>Total <br>/ person</p>
              <p>$0.00</p>
            </div>
          </div>

          <button class="tip-reset" id="reset">Reset</button>
        </section>
      </div>
      <br />
    </main>

    <!-- <div class="attribution">

        >Alberth Ruado</a
      >.
    </div> -->
  </body>
</html>
